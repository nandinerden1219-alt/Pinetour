<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <section>
      <h2>To-Do list</h2>
      <div id="NewTask">
        <input id="CreateTask" type="text" placeholder="Add a new task..." />
        <button onclick="AddedTasks()">Add</button>
      </div>
      <div class="Category">
        <div id="All" onclick="showAll()">All</div>
        <div id="Active" onclick="showActive()">Active</div>
        <div id="Completed" onclick="showCompleted()">Completed</div>
      </div>
      <div id="TaskListBox">
        <span id="emptyMessage">No tasks yet. Add one above!</span>
      </div>

      <p>Powered by Pinecone academy</p>
    </section>
    <script src="index.js"></script>
  </body>
</html>
